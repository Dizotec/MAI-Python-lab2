[project]
name = "labs"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["streamstats"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 81
show_missing = true
precision = 2
